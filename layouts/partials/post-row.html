<li class="post-row">
  <time class="meta" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
  <div class="post-row-body">
    <a class="post-row-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{- with .Params.published_as }}<span class="meta meta-note">as {{ . }}</span>{{ end }}  </div>
</li>
