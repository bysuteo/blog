{{- /* Reading controls, same behaviour as the Nox house sites:
       essays get A−/A+ and back-to-top; other pages get back-to-top only. */ -}}
{{- $isPost := and .IsPage (eq .Section "posts") -}}
<div class="reader-controls{{ if not $isPost }} reader-controls--toponly{{ end }}" id="readerControls">
  {{- if $isPost }}
  <button class="rc-btn" type="button" data-rc="-1" aria-label="Smaller text">A&minus;</button>
  <button class="rc-btn" type="button" data-rc="1" aria-label="Larger text">A+</button>
  <span class="rc-divider" aria-hidden="true"></span>
  {{- end }}
  <button class="rc-btn" type="button" data-rc="top" aria-label="Back to top">&uarr;</button>
</div>
<script>
(function () {
  var root = document.documentElement;
  function setTheme(t) {
    root.dataset.theme = t;
    try { localStorage.setItem('pref-theme', t); } catch (e) {}
  }
  document.querySelectorAll('.theme-toggle').forEach(function (b) {
    b.addEventListener('click', function () { setTheme(root.dataset.theme === 'light' ? 'dark' : 'light'); });
  });
  var scale = 1;
  try { scale = parseFloat(localStorage.getItem('suteo-fs')) || 1; } catch (e) {}
  function applyScale() { root.style.setProperty('--font-scale', scale); }
  applyScale();
  var rc = document.getElementById('readerControls');
  if (!rc) return;
  rc.addEventListener('click', function (e) {
    var b = e.target.closest('[data-rc]'); if (!b) return;
    var v = b.getAttribute('data-rc');
    if (v === 'top') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    scale = Math.min(1.3, Math.max(0.85, Math.round((scale + 0.075 * parseInt(v, 10)) * 1000) / 1000));
    try { localStorage.setItem('suteo-fs', scale); } catch (e) {}
    applyScale();
  });
  function onScroll() { rc.classList.toggle('is-visible', window.scrollY > 300); }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
