baseURL = "https://suteo.dev/"
locale = "en-GB"
title = "suteo"
enableRobotsTXT = true
# The site is self-contained: custom layouts in /layouts, no theme dependency.

[params]
  description = "suteo — websites, publishing systems and small software, and notes on building them."
  tagline = "A workshop for durable software."
  author = "suteo"
  github = "https://github.com/bysuteo"
  store = "https://loopwright.gumroad.com"
  house = "https://www.arxnox.com/"
  # Until a suteo mailbox exists, enquiries go to the house address.
  email = "nox@arxnox.com"

[taxonomies]
  tag = "tags"

# Writing keeps the URLs it was first published under (/posts/<slug>/),
# so links to the Loopwright-era essays keep working after the move.
[permalinks]
  posts = "/posts/:slug/"
  work = "/work/:slug/"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[menus]
  [[menus.main]]
    name = "Work"
    pageRef = "/work"
    weight = 1
  [[menus.main]]
    name = "Writing"
    pageRef = "/posts"
    weight = 2
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 3

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[sitemap]
  changefreq = "monthly"
